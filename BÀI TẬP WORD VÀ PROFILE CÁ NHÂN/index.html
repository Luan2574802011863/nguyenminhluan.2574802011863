<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cá Nhân</title>
    <style>
        body{
            background-color: #e8f4f8;
            font-family: Arial;
        }
        .card{
            width:350px;
            margin: 50px auto;
            padding: 25px;
            border: 2px solid #555;
            border-radius:20px;
            background-color: white;
            text-align: text;
        }
        .avatar{
            width:120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00a8cc;
        }
        .name{
            color: #0066cc;
            font-size: 30px;
            margin: 15px 0 5px;
        }
        .job{
            color: #777;
            font-size: 18px;
        }
        .intro{
            color: #444;
            line-straight: 1.6;
            margin: 20px 0;
        }
        .skills{
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }
        .skills li{
            background-color: #e6f7ff;
            padding: 20px;
            margin: 8px;
            border-radius: 10px;
        }
        .btn{
            display: inline-block;
            padding: 12px 5px;
            margin-top: 10px;
            background-color: #00a8cc;
            color:white;
            border: radius 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="avatar" scr="avatar.jpg" alt="Avatar">

        <h1 class="name">Nguyễn Minh Luân</h1>

        <h2 class="job">Sinh Viên IT</h2>

        <p claas="intro">
            Xin chào! Mình là Nguyễn Minh Luân, một sinh viên yêu thích công nghệ. Mình đam mê và muốn phát triển ngành hệ thông nhúng (Embedded System).
        </p>
        <h3>Kỹ năng</h3>
        <ul class="skills">
            <li>C/ C+++</li>
            <li>Python</li>
            <li>Java</li>
            <li>Rust</li>
        </ul>
        <a href="#" class ="btn"> Liên hệ</a>
    </div>
</body>
</html>
